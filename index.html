<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="application-name" content="Juan & Isa" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Juan & Isa" />
    <meta name="theme-color" content="#F8F3EC" />
    <meta name="description" content="Your shared bucket list, together." />
    <!--
      Paths are relative on purpose. With %BASE_URL% the dev server expanded it
      to the base and then prefixed the base again, producing /ours/ours/… —
      which doesn't 404, it quietly returns the SPA fallback HTML, so iOS got a
      web page where it expected a PNG and fell back to a screenshot of the app.
      Relative resolves correctly against the base in both dev and build.

      The ?v= is a cache buster: iOS keeps home-screen icons keyed by URL and
      won't pick up new bytes at the same path, even if you delete the app and
      add it again. Bump it whenever the icon changes.
    -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png?v=2" />
    <!-- The manifest link is injected by vite-plugin-pwa (see vite.config.ts) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>Juan & Isa — your plans, together</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
